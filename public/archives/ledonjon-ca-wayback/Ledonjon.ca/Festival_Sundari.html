            <div class="tinyText" style="height: 1624px; left: 23px; position: absolute; top: 4010px; width: 659px; z-index: 1; ">
              <img usemap="#map1" id="shapeimage_1" src="Festival_Sundari_files/shapeimage_1.png" style="border: none; height: 1673px; left: -32px; position: absolute; top: -32px; width: 727px; z-index: 1; " alt="&#10;• DUB STYLE SELECTAH live vs SABI NON STOP (((Montréal))) &#10;Dub&#10;&#10;ૐ RIKAM vs MAT THC (((Montréal))) &#10;Tech Safari Productions / Eclipse Festival &#10;Neurobiotic records &#10;Producteurs du Festival Eclipse et acteurs importants sur la scène de musique trance montréalaise, Éric et Mat en tagteam nous préparent un set ambiant psychedelic vs downtempo, un spécial pour l'occasion! &#10;Producers of Eclipse Festival and importants actors on the Montreal trance music scene, Eric and Mat in tagteam prepare us an ambiant psychedelic vs downtempo set, a special for this occasion! &#10;==&gt; [ www.myspace.com ] &#10;==&gt; [ www.eclipsefestival.com ] &#10;==&gt; [ www.techsafari.ca ] &#10;&#10;ૐ SEB vs KIRAN (((Montréal))) &#10;Mandala sound &amp; vision &#10;Seb et Kiran nous préparent un set ethno ambiant à la Interchill qu'ils vont jouer en tagteam ♥! &#10;==&gt; [ www.rave.ca ] &#10;&#10;ૐ BENDALA (((Montréal))) &#10;Tribal Prophecy / Space Gathering Festival &#10;Benoit joue du Worldbeat peace &amp; love &#10;&#10;ૐ PSYBERTH (((Montréal))) &#10;Amateur de la musique psychill, d'un downtempo à caractère très groovy et aux sonorités organiques, tribales et mélodiques, Olivier vous invite à voyager avec lui, pour une petite excursion, à travers cette musique mystique et transcendantale. &#10;===&gt; [ www.facebook.com ] &#10;===&gt; [ www.oberthelot.com ] &#10;&#10;ૐ LONGSTOCKING vs AQUARIUS (((Montréal))) &#10;[ www.facebook.com ] &#10;&#10;ૐ SOLAR PROPHECY (((Sherbrooke))) &#10;&#10;ૐ YVY (((Sherbrooke)))&#10;Aux travers ses mixes, Steve crée une totale pureté de bien être intemporel, une unification vibratoire de l'amour en un petit point dans l'univers qui est la Terre, YvY c'est l'amour de nous, de nous qui sommes musique... il nous prépare un set ambiant psychédélique et dub. &#10;&#10;ૐ LUNAR GROOVE (((Montréal)))&#10;Relaxation Lounge &#10;Style chill-out &#10;==&gt; [ soundcloud.com ] &#10;&#10;ૐ PSYRENITY (((Montréal)))&#10;Psychedelic Sanctuary Creations &#10;Usef va jouer un set tribal psychill &#10;==&gt; [ www.rave.ca ] &#10;&#10;ૐ DECEPTION ((Montréal)))&#10;Un mix de goa et de prog plein de surprises &#10;&#10;ૐ SPOONANI (((Québec)))&#10;Chill-out drum'n bass &#10;==&gt; [ soundcloud.com ] &#10;&#10;ૐ PRANA PAPA (((Québec)))&#10;Du chaïchill au psyworld, Paolo nous fait danser, méditer et voyager dans la Global trance family. &#10;==&gt; [ www.facebook.com ] &#10;&#10;ૐ ZEN (((Inverness))) &#10;Altar Records &#10;Actif depuis 1995 dans la scène underground trance et ambiante psychédélique, Gabriel se spécialise dans la musique ambiante-transe et psychédélique-chill avec une certaine symbiose orientale, féerique et chamanique. &#10;==&gt; [ www.altar-records.com ] &#10;&#10;ૐ ANDREÏ K (((Montréal))) &#10;&#10;ૐ SEMIRA (((Québec))) &#10;Semira va nous emporter avec du groovy earth chill. &#10;&#10;ૐ ALAKAZOO (((St-Fortunat))) &#10;Psy Bucheron Prod &#10;Vincent va jouer un set psy dub downtempo à 70bpm. &#10;&#10;ૐ SINAË (((Montréal))) &#10;&#10;ૐ ZVEN (((Montréal))) &#10;Zven nous prépare un set ambiant psychédélique&#10;" title="" /><map name="map1" id="map1"><area href="http://www.myspace.com/djrikam" title="http://www.myspace.com/djrikam" onmouseover="IMmouseover('shapeimage_1', '0');" alt="http://www.myspace.com/djrikam" onmouseout="IMmouseout('shapeimage_1', '0');" shape="rect" coords="75, 271, 198, 289" /><area href="http://www.eclipsefestival.com/" title="http://www.eclipsefestival.com/" onmouseover="IMmouseover('shapeimage_1', '1');" alt="http://www.eclipsefestival.com/" onmouseout="IMmouseout('shapeimage_1', '1');" shape="rect" coords="75, 288, 231, 306" /><area href="http://www.techsafari.ca/" title="http://www.techsafari.ca/" onmouseover="IMmouseover('shapeimage_1', '2');" alt="ht             <div class="tinyText" style="height: 714px; left: 23px; position: absolute; top: 686px; width: 659px; z-index: 1; ">
              <img usemap="#map2" id="shapeimage_4" src="Festival_Sundari_files/shapeimage_4.png" style="border: none; height: 974px; left: -250px; position: absolute; top: -17px; width: 1163px; z-index: 1; " alt="ૐ DREAMTREE PROJECT live (((Nelson/BC - Val Morin/QC))) &#10;&#10;The DreamTree Project&quot; est le projet dub fusion indien du nominé Juno Adham Shaikh (electronics n dubs) et Uwe Neumann (Sitar, kanjira, sanza).  Ce dynamique duo produit un style de musique de raga indien valsant sur un dub ethnique de tabla envoûtant, de flutes mystiques, aux rythmes aériens et aux basses profondes. Là où les notions de l'est rencontrent celles de l'ouest, DreamTree conjure un espace fertile pour ceux qui tardent à être séduits par les pouvoirs rituels de la musique et la possibilité de l'engagement en l'illumination commune. &#10;&#10;The dreamtree project is the indian dub fusion project of Juno nominee Adham Shaikh (electronics n dubs) and Uwe Neumann (Sitar, kanjira, sanza).  This dynamic duo weaves a magic carpet ride of classical Indian raga afloat a dub cloud of swirling tabla, mystical flutes, spacey beats and booming basslines. Beyond notions of east meets west. Dreamtree conjures a fertile space for all who long to be seduced by the ritual power of music and the possibility of enlightened communal engagement. &#10;&#10;==&gt; [ www.facebook.com ] &#10;==&gt; [ www.sonicturtle.com ] &#10;&#10;￼" title="" /><map name="map2" id="map2"><area href="http://www.facebook.com/pages/Dreamtree-Project/165839836778333?v=info" title="http://www.facebook.com/pages/Dreamtree-Project/165839836778333?v=info" onmouseover="IMmouseover('shapeimage_4', '0');" alt="http://www.facebook.com/pages/Dreamtree-Project/165839836778333?v=info" onmouseout="IMmouseout('shapeimage_4', '0');" shape="rect" coords="293, 271, 419, 289" /><area href="http://www.sonicturtle.com/store/dreamtree-project/" title="http://www.sonicturtle.com/store/dreamtree-project/" onmouseover="IMmouseover('shapeimage_4', '1');" alt="http://www.sonicturtle.com/store/dreamtree-project/" onmouseout="IMmouseout('shapeimage_4', '1');" shape="rect" coords="293, 288, 429, 306" /></map><img style="height: 18px; left: 43px; position: absolute; top: 254px; width: 126px; " id="shapeimage_4_link_0" alt="shapeimage_4_link_0" src="Festival_Sundari_files/shapeimage_4_link_0.png" /><img style="height: 18px; left: 43px; position: absolute; top: 271px; width: 136px; " id="shapeimage_4_link_1" alt="shapeimage_4_link_1" src="Festival_Sundari_files/shapeimage_4_link_1.png" />

            <div class="tinyText" style="height: 321px; left: 22px; position: absolute; top: 1421px; width: 660px; z-index: 1; ">
              <img usemap="#map3" id="shapeimage_5" src="Festival_Sundari_files/shapeimage_5.png" style="border: none; height: 354px; left: -16px; position: absolute; top: -16px; width: 697px; z-index: 1; " alt="ૐ ADHAM SHAIKH live (((Nelson/BC))) &#10;&#10;Adham tisse habilement sonorités organiques et électroniques en musique du monde qui transporte les auditeurs sur des voyages sonores et qui transcende le temps et le lieu. Il a publié 12 albums et de nombreuses compositions individuelles, dont la publication en 2004, Fusion, qui a été nominée pour un prix Juno (Canada Grammy) dans la catégorie World Music. Les labels de musique du monde entier ont publié sa musique, y compris Interchill, Dakini Records, Electronic Soundscapes, Liquid Sound Design, Native State, One World Music, Water Music, Nia, Sounds True, Stoned Asia, et les Six Degrees. &#10;&#10;Adham skillfully weaves organic and electronic sounds into global music tapestries that take listeners on sonic journeys transcending time and place. He has released 12 albums and many individual compositions, among them the 2004 release, Fusion, which was nominated for a Juno Award (Canadian Grammy) in the World Music category. Music labels from around the globe have released his music, including Interchill, Dakini Records, Electronic Soundscapes, Liquid Sound Design, Native State, One World Music, Water Music, Nia, Sounds True, Stoned Asia, and the infamous Six Degrees. &#10;&#10;==&gt; [ musique.fluctuat.net ] &#10;==&gt; [ www.myspace.com ] &#10;==&gt; [ www.sonicturtle.com ] &#10;" title="" /><map name="map3" id="map3"><area href="http://musique.fluctuat.net/adham-shaikh.html" title="http://musique.fluctuat.net/adham-shaikh.html" onmouseover="IMmouseover('shapeimage_5', '0');" alt="http://musique.fluctuat.net/adham-shaikh.html" onmouseout="IMmouseout('shapeimage_5', '0');" shape="rect" coords="59, 266, 191, 284" /><area href="http://www.myspace.com/sonicturtle44" title="http://www.myspace.com/sonicturtle44" onmouseover="IMmouseover('shapeimage_5', '1');" alt="http://www.myspace.com/sonicturtle44" onmouseout="IMmouseout('shapeimage_5', '1');" shape="rect" coords="59, 283, 182, 301" /><area href="http://www.sonicturtle.com/" title="http://www.sonicturtle.com/" onmouseover="IMmouseover('shapeimage_5', '2');" alt="http://www.sonicturtle.com/" onmouseout="IMmouseout('shapeimage_5', '2');" shape="rect" coords="59, 300, 195, 318" /></map><img style="height: 18px; left: 43px; position: absolute; top: 250px; width: 132px; " id="shapeimage_5_link_0" alt="shapeimage_5_link_0" src="Festival_Sundari_files/shapeimage_5_link_0.png" /><img style="height: 18px; left: 43px; position: absolute; top: 267px; width: 123px; " id="shapeimage_5_link_1" alt="shapeimage_5_link_1" src="Festival_Sundari_files/shapeimage_5_link_1.png" /><img style="height: 18px; left: 43px; position: absolute; top: 284px; width: 136px; " id="shapeimage_5_link_2" alt="shapeimage_5_link_2" src="Festival_Sundari_files/shapeimage_5_link_2.png" />

            <div class="tinyText" style="height: 260px; left: 23px; position: absolute; top: 1763px; width: 659px; z-index: 1; ">

            <div class="tinyText" style="height: 280px; left: 23px; position: absolute; top: 2044px; width: 659px; z-index: 1; ">
              <img usemap="#map5" id="shapeimage_7" src="Festival_Sundari_files/shapeimage_7.png" style="border: none; height: 313px; left: -16px; position: absolute; top: -16px; width: 696px; z-index: 1; " alt="ૐ LUTIN DES BOIS live (((Paris/France))) ૐ&#10;(Hadra Rec/Atomes/oréades) &#10;&#10;Fondateur du groupe Secret Vibes, Jean-Jacques est aussi Dj. Ses mixes distillent un groove instrumental très chaleureux, avec un beat électronique trés présent. L'atmosphère qui s'en dégage est appréciée tant par les amateurs de sons ethniques, indies &amp; autres que par les amoureux de transe, diversifiant à chaque fois ses sets, allant même jusqu'à l'ambiant et l'electro-dub. Jean-Jacques nous prépare un set ambiant très ethno qui reprend des tracks de Secret Vibes. &#10;&#10;Fondator of Secret Vibes, he's also a Dj. His mix-sets distills a very warm instrumental groove and are very appreciated by lovers of Ethnic-sounds, Indies and other groovy electronic-Dub. Jean-Jacques prepare an ethno-ambiant set with Secret Vibes tracks. &#10;&#10;==&gt; [ www.myspace.com ] &#10;==&gt; [ www.myspace.com ] &#10;" title="" /><map name="map5" id="map5"><area href="http://www.myspace.com/secretvibes" title="http://www.myspace.com/secretvibes" onmouseover="IMmouseover('shapeimage_7', '0');" alt="http://www.myspace.com/secretvibes" onmouseout="IMmouseout('shapeimage_7', '0');" shape="rect" coords="59, 242, 182, 260" /><area href="http://www.myspace.com/djlutindesbois" title="http://www.myspace.com/djlutindesbois" onmouseover="IMmouseover('shapeimage_7', '1');" alt="http://www.myspace.com/djlutindesbois" onmouseout="IMmouseout('shapeimage_7', '1');" shape="rect" coords="59, 259, 182, 277" /></map><img style="height: 18px; left: 43px; position: absolute; top: 226px; width: 123px; " id="shapeimage_7_link_0" alt="shapeimage_7_link_0" src="Festival_Sundari_files/shapeimage_7_link_0.png" /><img style="height: 18px; left: 43px; position: absolute; top: 243px; width: 123px; " id="shapeimage_7_link_1" alt="shapeimage_7_link_1" src="Festival_Sundari_files/shapeimage_7_link_1.png" />

            <div class="tinyText" style="height: 255px; left: 23px; position: absolute; top: 2345px; width: 659px; z-index: 1; ">
              <img usemap="#map6" id="shapeimage_8" src="Festival_Sundari_files/shapeimage_8.png" style="border: none; height: 288px; left: -16px; position: absolute; top: -16px; width: 696px; z-index: 1; " alt="ૐ FREEWORM live (((Montréal/QC))) ૐ&#10;Maintenant actif sous National Parcs &#10;&#10;Vincent est un ancien guitariste de rock progressif qui s’est converti à la musique électronique tout en restant fidèle à ses racines acoustiques. Original, il va même jusqu’à incorporer dans sa musique des échantillonnages de sons de la nature. Résultat : celui qu'on surnomme « l’environnementaliste sonore » produit de « l’électro-organique », un bel amalgame de groove, d’ambiant, de pop, de world, d’électronique, et bien d'autres styles… [ www.bandeapart.fm ] Il nous prépare un set avec ses anciennes compositions et des visuels de ses récents projets avec le Biodome de Montréal. &#10;&#10;==&gt; [ www.youtube.com ] &#10;==&gt; [ www.freeworm.ca ] &#10;==&gt; [ www.myspace.com ] &#10;" title="" /><map name="map6" id="map6"><area href="http://(http://www.bandeapart.fm/artistes/Entree.aspx?id=4928)." title="http://(http://www.bandeapart.fm/artistes/Entree.aspx?id=4928)." onmouseover="IMmouseover('shapeimage_8', '0');" alt="http://(http://www.bandeapart.fm/artistes/Entree.aspx?id=4928)." onmouseout="IMmouseout('shapeimage_8', '0');" shape="rect" coords="276, 149, 406, 167" /><area href="http://www.youtube.com/watch?v=c2sNSQo7eJw&amp;feature=player_embedded" title="http://www.youtube.com/watch?v=c2sNSQo7eJw&amp;feature=player_embedded" onmouseover="IMmouseover('shapeimage_8', '1');" alt="http://www.youtube.com/watch?v=c2sNSQo7eJw&amp;feature=player_embedded" onmouseout="IMmouseout('shapeimage_8', '1');" shape="rect" coords="59, 200, 180, 218" /><area href="http://www.freeworm.ca/" title="http://www.freeworm.ca/" onmouseover="IMmouseover('shapeimage_8', '2');" alt="http://www.freeworm.ca/" onmouseout="IMmouseout('shapeimage_8', '2');" shape="rect" coords="59, 217, 177, 235" />             <div class="tinyText" style="height: 246px; left: 23px; position: absolute; top: 2814px; width: 659px; z-index: 1; ">
              <img usemap="#map7" id="shapeimage_9" src="Festival_Sundari_files/shapeimage_9.png" style="border: none; height: 276px; left: -13px; position: absolute; top: -13px; width: 695px; z-index: 1; " alt="ૐ XNOROPHIS live (((Montréal/QC))) ૐ&#10;&#10;Martin aka Xnorophis offre une musique organique marginale, apportant éléments acoustiques, sons du monde et des vocaux écliptiques à ses mixes. Sa musique varie du dub au transe psychédélique absorbant plusieurs autres styles, minimal, techno, breaks, glitch, electro et progressif. Il nous prépare un nouveau set de musique dub tribal pour Sundari. &#10;&#10;Martin aka Xnorophis offers an organic edge to electronic music, bringing in accoustic elements, world sounds and ecliptic vocals to the mix. The music ranges from dub to psychedelic trance absorbing many other musical styles; minimal, techno, breaks, glitch, electro &amp; prog. Il nous prépare un nouveau set de musique dub tribal pour Sundari... &#10;&#10;==&gt; [ xnorophis.com ] &#10;==&gt; [ xnorophis.com ] &#10;" title="" /><map name="map7" id="map7"><area href="http://xnorophis.com/" title="http://xnorophis.com/" onmouseover="IMmouseover('shapeimage_9', '0');" alt="http://xnorophis.com/" onmouseout="IMmouseout('shapeimage_9', '0');" shape="rect" coords="56, 205, 149, 223" /><area href="http://xnorophis.com/Xnoromp3/Cavemen.html" title="http://xnorophis.com/Xnoromp3/Cavemen.html" onmouseover="IMmouseover('shapeimage_9', '1');" alt="http://xnorophis.com/Xnoromp3/Cavemen.html" onmouseout="IMmouseout('shapeimage_9', '1');" shape="rect" coords="56, 222, 149, 240" /></map><img style="height: 18px; left: 43px; position: absolute; top: 192px; width: 93px; " id="shapeimage_9_link_0" alt="shapeimage_9_link_0" src="Festival_Sundari_files/shapeimage_9_link_0.png" /><img style="height: 18px; left: 43px; position: absolute; top: 209px; width: 93px; " id="shapeimage_9_link_1" alt="shapeimage_9_link_1" src="Festival_Sundari_files/shapeimage_9_link_1.png" />

            <div class="tinyText" style="height: 235px; left: 23px; position: absolute; top: 3083px; width: 659px; z-index: 1; ">

            <div class="tinyText" style="height: 219px; left: 23px; position: absolute; top: 3342px; width: 659px; z-index: 1; ">
